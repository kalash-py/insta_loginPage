<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Response Portal | Demo</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Response Portal</span>
      </div>
      <a href="/admin.html" class="admin-link">Go to Admin Panel &rarr;</a>
    </header>

    <main class="form-wrapper">
      <div class="form-card">
        <div class="form-header">
          <h2>Submit Response</h2>
          <p>Enter your details and response below. Submissions will reflect live on the Admin Panel.</p>
        </div>

        <form id="responseForm">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="General Query">General Query</option>
              <option value="Feedback">Feedback</option>
              <option value="Technical Support">Technical Support</option>
              <option value="Feature Request">Feature Request</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Your Response / Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Write your message or inquiry here..." required></textarea>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary">
            <span>Submit Response</span>
          </button>

          <div id="statusMessage" class="status-msg hidden"></div>
        </form>
      </div>
    </main>

    <footer class="app-footer">
      <p>&copy; 2026 User Response Portal Demo &bull; Optimized for Mobile & Desktop</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
